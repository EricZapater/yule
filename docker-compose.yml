services:
  yule-backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ericzapater}/yule-backend:latest
    container_name: yule-backend
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      - TZ=Europe/Madrid
    volumes:
      - yule_photos:/app/uploads/photos
    networks:
      - postgres-network
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yule-backend.rule=Host(`api.yule.ericzapater.cat`)"
      - "traefik.http.routers.yule-backend.entrypoints=websecure"
      - "traefik.http.routers.yule-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yule-backend.service=yule-backend"
      - "traefik.http.services.yule-backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=web"

  yule-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ericzapater}/yule-frontend:latest
    container_name: yule-frontend
    restart: unless-stopped
    env_file:
      - .env.frontend
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yule-frontend.rule=Host(`yule.ericzapater.cat`)"
      - "traefik.http.routers.yule-frontend.entrypoints=websecure"
      - "traefik.http.routers.yule-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yule-frontend.service=yule-frontend"
      - "traefik.http.services.yule-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=web"

volumes:
  yule_photos:
    name: yule_photos

networks:
  web:
    external: true
  postgres-network:
    external: true
